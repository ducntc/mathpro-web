<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathPro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo"><a href="/" style="margin:0; text-decoration:none; color:inherit;">MATH<span>PRO</span></a></div>
    <nav>
      <a href="/" data-i18n="nav.home">🏠 Trang chủ</a>
      <a href="/#courses" data-i18n="nav.courses">📚 Tất cả khóa học</a>
    </nav>
  </header>

  <main class="container">
    <div id="course-detail" class="card" style="padding: 32px;">
      <p data-i18n="common.loading">Đang tải dữ liệu...</p>
    </div>
  </main>

  <script src="/js/i18n.js"></script>
  <script>
    async function loadCourseDetail() {
      document.title = t('Chi tiết khóa học - MathPro', 'Course Details - MathPro');
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const container = document.getElementById('course-detail');

      if (!id) {
        container.innerHTML = `<p>${t('Chưa chọn khóa học.', 'No course selected.')} <a href="/">${t('Quay lại trang chủ', 'Back to Home')}</a></p>`;
        return;
      }

      const res = await fetch(`/api/courses/${id}`);
      if (!res.ok) {
        container.innerHTML = `<p>${t('Không tìm thấy khóa học.', 'Course not found.')} <a href="/">${t('Quay lại trang chủ', 'Back to Home')}</a></p>`;
        return;
      }

      const course = await res.json();
      const total = course.lessons.length;
      const doneCount = course.lessons.filter(l => l.completed === 1).length;
      const percent = total > 0 ? Math.round((doneCount / total) * 100) : 0;

      const lessonsHtml = total
        ? course.lessons.map(l => {
            const scoreStr = l.quiz_total ? ` (${l.quiz_score}/${l.quiz_total})` : '';
            const badge = l.completed
              ? `<span style="color:#2e7d32; font-weight:700; margin-left:8px;">✅ ${t('Đã xong', 'Completed')}${scoreStr}</span>`
              : '';
            return `
              <li style="border-bottom: 1px solid #eee;">
                <a href="/lesson.html?id=${l.id}" style="padding: 12px 8px; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: #333;">
                  <span><strong>${t('Bài', 'Lesson')} ${l.lesson_order}:</strong> ${l.title} ${badge}</span>
                  <span style="color: #0b5ed7; font-size: 14px; font-weight: 600;">⏱ ${l.duration} →</span>
                </a>
              </li>
            `;
          }).join('')
        : `<li>${t('Chưa có bài học nào trong khóa này.', 'No lessons available in this course yet.')}</li>`;

      container.innerHTML = `
        <span style="color:#0b5ed7; font-weight:700;">${MP_I18N.gradeName(course.grade)}</span>
        <h1 style="margin: 8px 0 12px; color:#ff7a00;">${course.title}</h1>
        <p style="font-size:17px; margin-bottom:20px;">${course.description}</p>

        <div style="background:#f1f5f9; padding:14px 18px; border-radius:8px; margin-bottom:24px;">
          <div style="display:flex; justify-content:space-between; font-weight:600; margin-bottom:6px;">
            <span>${t('Tiến độ học tập', 'Learning Progress')}</span>
            <span>${doneCount}/${total} ${t('bài', 'lessons')} (${percent}%)</span>
          </div>
          <div style="background:#dbeafe; height:10px; border-radius:6px; overflow:hidden;">
            <div style="background:#0b5ed7; width:${percent}%; height:100%; transition:width 0.3s;"></div>
          </div>
        </div>

        <h3 style="margin-bottom:10px; color:#333;">${t(`Nội dung khóa học (${total} bài)`, `Course Curriculum (${total} lessons)`)}</h3>
        <ul style="list-style: none; margin-bottom: 24px;">
          ${lessonsHtml}
        </ul>

        <a href="/subscribe.html" class="btn-primary">${t('Đăng ký gói VIP', 'Upgrade to VIP')}</a>
        <a href="/" style="margin-left:16px; color:#0b5ed7; font-weight:600;">← ${t('Quay lại trang chủ', 'Back to Home')}</a>
      `;
    }

    loadCourseDetail();
  </script>
</body>
</html>
