<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Sign Up - MathPro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo"><a href="/" style="margin:0;">MATH<span>PRO</span></a></div>
    <nav><a href="/">Back to Home</a></nav>
  </header>

  <section class="container register-box" style="margin-top: 50px;">
    <h2 id="form-title">Log In</h2>
    <form id="auth-form">
      <input type="text" id="name" placeholder="Full Name" style="display:none;" />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password (min 6 chars)" required />
      <button type="submit" class="btn-primary" id="submit-btn">Log In</button>
    </form>
    <p id="auth-msg" style="margin-top:12px; text-align:center; font-weight:600;"></p>
    <p style="margin-top:16px; text-align:center;">
      <a href="#" id="toggle-mode">Don't have an account? Sign Up</a>
    </p>
  </section>

  <script>
    let isSignup = false;
    const toggleLink = document.getElementById('toggle-mode');
    const nameInput = document.getElementById('name');
    const title = document.getElementById('form-title');
    const btn = document.getElementById('submit-btn');

    toggleLink.addEventListener('click', (e) => {
      e.preventDefault();
      isSignup = !isSignup;
      nameInput.style.display = isSignup ? 'block' : 'none';
      nameInput.required = isSignup;
      title.textContent = isSignup ? 'Create Account' : 'Log In';
      btn.textContent = isSignup ? 'Sign Up' : 'Log In';
      toggleLink.textContent = isSignup ? 'Already have an account? Log In' : "Don't have an account? Sign Up";
    });

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const endpoint = isSignup ? '/api/signup' : '/api/login';
      const payload = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        ...(isSignup && { name: nameInput.value })
      };

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      const msg = document.getElementById('auth-msg');
      msg.style.color = res.ok ? 'green' : 'red';
      msg.textContent = data.message;

      if (res.ok) setTimeout(() => window.location.href = '/', 800);
    });
  </script>
</body>
</html>
